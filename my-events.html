<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Events | Pick Up Sports</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="events.html">Browse Events</a>
            <a href="my-events.html" aria-current="page">My Events</a>
            <a href="create.html">Host an Event</a>
        </nav>
    </header>

    <main id="main-content" tabindex="-1" class="screen listing">
        <h1>My Events</h1>

        <ul class="event-list" role="list">
            <li class="event-card">
                <div class="sport-icon soccer-icon" aria-hidden="true"></div>
                <div class="event-info">
                    <h2>Soccer</h2>
                    <p>Nov. 25, 5–6 pm</p>
                    <p>3/6 players</p>
                    <p>Hooker Field</p>
                    <p>Role: Hosting</p>
                </div>
            </li>
            <li class="event-card">
                <div class="sport-icon basketball-icon" aria-hidden="true"></div>
                <div class="event-info">
                    <h2>Basketball</h2>
                    <p>Nov. 27, 11 am–noon</p>
                    <p>5/10 players</p>
                    <p>Pleasant Park</p>
                    <p>Role: Joining</p>
                </div>
            </li>
        </ul>

        <a class="back" href="play.html" aria-label="Back to Host or Find">&larr;</a>
    </main>
</body>
</html>
